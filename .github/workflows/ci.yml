name: NODUS checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/browser-smoke.mjs
      - run: npx tsc -p tsconfig.app.json --noEmit --noUnusedLocals --noUnusedParameters
      - run: npm audit --omit=dev
